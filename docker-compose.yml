services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devtrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devtrace123}
      POSTGRES_DB: ${POSTGRES_DB:-devtrace}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8002:8000"
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-devtrace}:${POSTGRES_PASSWORD:-devtrace123}@postgres:5432/${POSTGRES_DB:-devtrace}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
